<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background halftone Ben-Day dots pattern -->
    <pattern id="benday-blue" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3.2" fill="#0066d6" />
    </pattern>
    <pattern id="benday-sun" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#FF7B00" />
    </pattern>
    <pattern id="benday-cloud" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.8" fill="#58B8FF" opacity="0.65" />
    </pattern>
    <pattern id="benday-text" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#E6A800" opacity="0.6" />
    </pattern>

    <!-- Clip path for app icon squircle -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>

    <!-- Drop filter -->
    <filter id="pop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="hard-shadow-sm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base App Icon Cyan-Blue Sky -->
    <rect width="512" height="512" fill="#0080FF" />
    <!-- Halftone dots overlay -->
    <rect width="512" height="512" fill="url(#benday-blue)" />

    <!-- Comic Vignette Border Shadow inside -->
    <rect width="512" height="512" fill="none" stroke="#000000" stroke-width="16" />

    <!-- ================= SUN GROUP ================= -->
    <g transform="translate(245, 175)">
      <!-- Sun Rays (12 triangular comic spikes with thick black borders) -->
      <!-- Ray 1 (Top) -->
      <polygon points="0,-165 24,-105 -24,-105" fill="#FFCA00" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 2 -->
      <polygon points="85,-140 75,-80 35,-110" fill="#FFB300" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 3 -->
      <polygon points="145,-75 110,-35 80,-75" fill="#FFCA00" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 4 (Right) -->
      <polygon points="165,0 105,24 105,-24" fill="#FFB300" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 5 -->
      <polygon points="140,85 80,75 110,35" fill="#FFCA00" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 6 -->
      <polygon points="-85,-140 -35,-110 -75,-80" fill="#FFB300" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 7 -->
      <polygon points="-145,-75 -80,-75 -110,-35" fill="#FFCA00" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 8 (Left) -->
      <polygon points="-165,0 -105,-24 -105,24" fill="#FFCA00" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
      <!-- Ray 9 -->
      <polygon points="-140,85 -110,35 -80,75" fill="#FFB300" stroke="#000000" stroke-width="12" stroke-linejoin="round" />

      <!-- Sun Main Body Circle -->
      <circle cx="0" cy="0" r="108" fill="#FFE800" stroke="#000000" stroke-width="14" />
      <!-- Halftone Sun Shade Texture -->
      <path d="M 0,-108 A 108 108 0 0 1 108,0 A 108 108 0 0 1 0,108 Z" fill="url(#benday-sun)" opacity="0.65" clip-path="url(#squircle)" />
      <!-- Comic Highlight Curve on Sun -->
      <path d="M -70,-35 A 80 80 0 0 1 20,-80" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <circle cx="-50" cy="-60" r="7" fill="#FFFFFF" />
    </g>

    <!-- ================= CLOUD GROUP ================= -->
    <g>
      <!-- Comic Cloud Shadow Offset -->
      <path d="M 125,320 
               C 70,320 35,275 45,225 
               C 50,175 100,150 145,170 
               C 170,125 240,110 290,135 
               C 335,115 410,135 435,190 
               C 485,215 495,280 460,335 
               C 435,375 380,390 330,380 
               C 285,405 210,400 165,375 
               C 135,375 125,350 125,320 Z" 
            fill="#000000" transform="translate(10, 10)" />

      <!-- Main Comic Cloud Silhouette with thick outline -->
      <path d="M 125,320 
               C 70,320 35,275 45,225 
               C 50,175 100,150 145,170 
               C 170,125 240,110 290,135 
               C 335,115 410,135 435,190 
               C 485,215 495,280 460,335 
               C 435,375 380,390 330,380 
               C 285,405 210,400 165,375 
               C 135,375 125,350 125,320 Z" 
            fill="#FFFFFF" stroke="#000000" stroke-width="15" stroke-linejoin="round" />

      <!-- Cloud Ben-Day blue dot shading (Right/Bottom) -->
      <path d="M 280,145 
               C 330,125 405,145 430,195 
               C 475,220 485,280 450,330 
               C 430,365 375,380 330,370 
               C 285,395 210,390 165,365 
               C 210,330 250,250 280,145 Z" 
            fill="url(#benday-cloud)" />

      <!-- Comic Accent Glaze Lines on Cloud -->
      <path d="M 105,200 C 130,175 160,185 180,205" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" />
      <path d="M 390,175 C 415,195 425,230 420,260" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- ================= 3 RAINDROPS ================= -->
    <g transform="translate(0, 10)">
      <!-- Drop 1 -->
      <g transform="translate(225, 410) rotate(15)">
        <!-- Hard Shadow -->
        <path d="M 0,-40 C 18,-15 22,15 0,35 C -22,15 -18,-15 0,-40 Z" fill="#000000" transform="translate(6, 6)" />
        <!-- Drop Body -->
        <path d="M 0,-40 C 18,-15 22,15 0,35 C -22,15 -18,-15 0,-40 Z" fill="#0099FF" stroke="#000000" stroke-width="9" />
        <!-- Gloss highlight -->
        <ellipse cx="-5" cy="5" rx="4" ry="12" fill="#FFFFFF" transform="rotate(-15 -5 5)" />
      </g>

      <!-- Drop 2 -->
      <g transform="translate(315, 400) rotate(15)">
        <!-- Hard Shadow -->
        <path d="M 0,-40 C 18,-15 22,15 0,35 C -22,15 -18,-15 0,-40 Z" fill="#000000" transform="translate(6, 6)" />
        <!-- Drop Body -->
        <path d="M 0,-40 C 18,-15 22,15 0,35 C -22,15 -18,-15 0,-40 Z" fill="#0099FF" stroke="#000000" stroke-width="9" />
        <!-- Gloss highlight -->
        <ellipse cx="-5" cy="5" rx="4" ry="12" fill="#FFFFFF" transform="rotate(-15 -5 5)" />
      </g>

      <!-- Drop 3 -->
      <g transform="translate(395, 380) rotate(15)">
        <!-- Hard Shadow -->
        <path d="M 0,-35 C 16,-12 20,12 0,30 C -20,12 -16,-12 0,-35 Z" fill="#000000" transform="translate(5, 5)" />
        <!-- Drop Body -->
        <path d="M 0,-35 C 16,-12 20,12 0,30 C -20,12 -16,-12 0,-35 Z" fill="#0099FF" stroke="#000000" stroke-width="8" />
        <!-- Gloss highlight -->
        <ellipse cx="-4" cy="4" rx="3.5" ry="10" fill="#FFFFFF" transform="rotate(-15 -4 4)" />
      </g>
    </g>

    <!-- ================= POP WEATHER TYPOGRAPHY ================= -->
    <!-- Comic angled container -->
    <g transform="translate(240, 265) rotate(-9)">
      <!-- "POP" Giant 3D Comic Text -->
      <!-- Black 3D Extrusion Shadow Layer -->
      <text x="0" y="22" 
            text-anchor="middle" 
            font-family="'Titan One', 'Bangers', Impact, sans-serif" 
            font-size="152" 
            font-weight="900" 
            fill="#000000" 
            stroke="#000000" 
            stroke-width="32" 
            stroke-linejoin="round"
            letter-spacing="2">
        POP
      </text>
      <!-- Pop White-Cream Body -->
      <text x="-6" y="10" 
            text-anchor="middle" 
            font-family="'Titan One', 'Bangers', Impact, sans-serif" 
            font-size="152" 
            font-weight="900" 
            fill="#FFFCE8" 
            stroke="#000000" 
            stroke-width="16" 
            stroke-linejoin="round"
            letter-spacing="2">
        POP
      </text>
      <!-- Pop Halftone Dot Fill Overlay -->
      <text x="-6" y="10" 
            text-anchor="middle" 
            font-family="'Titan One', 'Bangers', Impact, sans-serif" 
            font-size="152" 
            font-weight="900" 
            fill="url(#benday-text)"
            letter-spacing="2">
        POP
      </text>

      <!-- "WEATHER" Black Comic Ribbon & Text -->
      <g transform="translate(0, 78) rotate(4)">
        <!-- Hard shadow for ribbon -->
        <rect x="-175" y="-38" width="350" height="66" rx="14" fill="#000000" transform="translate(6, 6)" />
        <!-- Main Ribbon in Black -->
        <rect x="-175" y="-38" width="350" height="66" rx="14" fill="#000000" stroke="#FFE800" stroke-width="5" />

        <!-- Weather Text in Cream White -->
        <text x="0" y="9" 
              text-anchor="middle" 
              font-family="'Bangers', 'Titan One', Impact, sans-serif" 
              font-size="52" 
              font-weight="900" 
              letter-spacing="4"
              fill="#FFFCE8">
          WEATHER
        </text>
      </g>
    </g>

    <!-- Retro Comic Highlight Sparkle -->
    <path d="M 450,90 L 458,110 L 478,118 L 458,126 L 450,146 L 442,126 L 422,118 L 442,110 Z" fill="#FFE800" stroke="#000000" stroke-width="4" />
  </g>

  <!-- Outer Iconic Pop Art Border -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="none" stroke="#000000" stroke-width="18" />
</svg>
