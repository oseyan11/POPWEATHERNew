<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background halftone Ben-Day dots pattern (Blue Sky) -->
    <pattern id="dot-blue" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4.2" fill="#0066E6" />
    </pattern>

    <!-- Sun halftone Ben-Day dots pattern (Yellow Sun with Orange Dots) -->
    <pattern id="dot-sun" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4.2" fill="#FF9E00" />
    </pattern>

    <!-- Clip path for app icon rounded corners if needed -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="108" ry="108" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Cyan-Blue Sky Background -->
    <rect width="512" height="512" fill="#0080FF" />
    <rect width="512" height="512" fill="url(#dot-blue)" />

    <!-- Pop Art Halftone Sun (Center Circle) -->
    <circle cx="256" cy="256" r="196" fill="#FFD800" />
    <circle cx="256" cy="256" r="196" fill="url(#dot-sun)" />
  </g>

  <!-- Clean Pop Art Comic Border -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="none" stroke="#000000" stroke-width="14" />
</svg>
